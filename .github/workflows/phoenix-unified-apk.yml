name: Phoenix Character Forge - exact Rig Studio 7.6 APK
on:
  workflow_dispatch:
    inputs:
      rig_apk_url:
        description: 'HTTPS link to exact Rig-Animation-Studio-v7.6-Chest-Guard-test.apk (public release asset)'
        required: true
        type: string
      character_ref:
        description: 'Character Studio source ref'
        required: true
        default: 'main'
        type: string

permissions:
  contents: read

jobs:
  unified-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Anim Retarget
        uses: actions/checkout@v4

      - name: Fetch Character Studio copy (original stays untouched)
        env:
          CHARACTER_REF: ${{ inputs.character_ref || 'main' }}
        run: |
          git clone --depth 1 --branch "$CHARACTER_REF" https://github.com/RayZenGreallyzzz/Character-Studio.git /tmp/phoenix-character
          echo "Character source SHA: $(git -C /tmp/phoenix-character rev-parse HEAD)" > /tmp/phoenix-source-revisions.txt

      - name: Download and verify user-supplied Rig Studio 7.6
        env:
          RIG_APK_URL: ${{ inputs.rig_apk_url }}
        shell: bash
        run: |
          test -n "$RIG_APK_URL" || { echo "::error::Exact v7.6 APK URL required; no fallback to old Rig"; exit 1; }
          case "$RIG_APK_URL" in https://*) ;; *) echo "::error::Only HTTPS download links are allowed"; exit 1;; esac
          curl --fail --show-error --silent --location --retry 3 --max-time 300 "$RIG_APK_URL" -o /tmp/rig-studio-v76.apk
          echo "rig_apk_sha256=$(sha256sum /tmp/rig-studio-v76.apk | cut -d' ' -f1)" >> /tmp/phoenix-source-revisions.txt
          python3 integration/extract_rig_v76.py /tmp/rig-studio-v76.apk /tmp/phoenix-rig/dist

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Test and build Character Studio web module
        working-directory: /tmp/phoenix-character
        run: |
          npm install --no-audit --no-fund
          npm test
          npm run build -- --base=./
          test -s dist/index.html

      - name: Test and build offline Geometry Optimizer
        working-directory: integration/optimizer
        run: |
          npm install --no-audit --no-fund
          npm test
          npm run build
          test -s dist/index.html

      - name: Test unified tabs and manifest injector
        run: |
          node --check integration/web/studio-shell.js
          python3 -m unittest discover -s integration/tests -v

      - name: Verify and extract original Anim Retarget Kotlin sources
        shell: bash
        run: |
          test -s payload/AnimRetargetAndroid_sources.b64
          base64 -d payload/AnimRetargetAndroid_sources.b64 > /tmp/animretarget-source.tar.bz2
          echo '18c9b6025a2567c4f2a004aab12213c2d1b26649c258427375bef6ef350e9f56  /tmp/animretarget-source.tar.bz2' | sha256sum -c -
          tar -xjf /tmp/animretarget-source.tar.bz2
          test -f AnimRetargetAndroid/app/src/main/AndroidManifest.xml
          test -f AnimRetargetAndroid/app/build.gradle.kts

      - name: Apply existing BVH hotfix
        run: python3 hotfix/retarget_math_hotfix.py AnimRetargetAndroid

      - name: Use original Rig menu as unified default tab
        run: |
          python3 -m py_compile integration/inject_shell.py
          python3 integration/inject_shell.py AnimRetargetAndroid /tmp/phoenix-rig/dist /tmp/phoenix-character/dist integration/optimizer/dist
          test -s AnimRetargetAndroid/app/src/main/assets/studio/optimize/index.html
          test -s AnimRetargetAndroid/app/src/main/assets/studio/rig/create.html
          test -s AnimRetargetAndroid/app/src/main/assets/studio/character/index.html

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'

      - name: Install Android SDK
        shell: bash
        run: |
          find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1 | xargs -r -I{} sh -c 'yes | "{}" --licenses >/dev/null 2>&1 || true'
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          "$SDKMANAGER" 'platforms;android-34' 'build-tools;34.0.0'

      - name: Build single offline APK
        working-directory: AnimRetargetAndroid
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verify APK signing and ZIP alignment before publishing
        shell: bash
        run: |
          APK="AnimRetargetAndroid/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/zipalign" -c -v 4 "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose "$APK"

      - name: Prepare source provenance
        run: |
          mkdir -p integration-output
          cp /tmp/phoenix-source-revisions.txt integration-output/source-revisions.txt
          sha256sum AnimRetargetAndroid/app/build/outputs/apk/debug/*.apk > integration-output/apk-sha256.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PhoenixCharacterForge-test-APK
          path: AnimRetargetAndroid/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload source provenance
        uses: actions/upload-artifact@v4
        with:
          name: PhoenixCharacterForge-source-refs
          path: integration-output/
          retention-days: 30
