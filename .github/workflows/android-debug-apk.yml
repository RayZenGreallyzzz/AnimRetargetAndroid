name: Build Anim Retarget APK

on:
  push:
    branches: [main]
    paths:
      - 'payload/AnimRetargetAndroid_sources.b64'
      - '.github/workflows/android-debug-apk.yml'
      - 'hotfix/retarget_math_hotfix.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Verify and unpack source files
        shell: bash
        run: |
          test -s payload/AnimRetargetAndroid_sources.b64
          base64 -d payload/AnimRetargetAndroid_sources.b64 > /tmp/animretarget-source.tar.bz2
          echo '18c9b6025a2567c4f2a004aab12213c2d1b26649c258427375bef6ef350e9f56  /tmp/animretarget-source.tar.bz2' | sha256sum -c -
          tar -xjf /tmp/animretarget-source.tar.bz2
          test -f AnimRetargetAndroid/app/build.gradle.kts
          test -f AnimRetargetAndroid/app/src/main/java/com/animretarget/app/Glb.kt

      - name: Apply tested BVH rotation hotfix
        run: python3 hotfix/retarget_math_hotfix.py AnimRetargetAndroid

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 34
        shell: bash
        run: |
          echo "Android SDK: $ANDROID_HOME"
          test -d "$ANDROID_HOME" || { echo "::error::Android SDK missing on runner"; exit 1; }
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -x "$SDKMANAGER" || { echo "::error::sdkmanager not found"; exit 1; }
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" 'platforms;android-34' 'build-tools;34.0.0'

      - name: Set up Gradle 8.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'

      - name: Build debug APK
        working-directory: AnimRetargetAndroid
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Upload installation APK
        uses: actions/upload-artifact@v4
        with:
          name: AnimRetargetAndroid-debug-APK
          path: AnimRetargetAndroid/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
