name: Build Anim Retarget APK

on:
  push:
    branches: [main]
    paths:
      - 'AnimRetargetAndroid_GitHub_Actions.zip'
      - '.github/workflows/android-debug-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Verify and unpack original sources
        shell: bash
        run: |
          test -s AnimRetargetAndroid_GitHub_Actions.zip || { echo "::error::Upload AnimRetargetAndroid_GitHub_Actions.zip to repository root first"; exit 1; }
          unzip -t AnimRetargetAndroid_GitHub_Actions.zip
          unzip -q AnimRetargetAndroid_GitHub_Actions.zip
          test -f AnimRetargetAndroid/app/build.gradle.kts
          test -f AnimRetargetAndroid/gradle/wrapper/gradle-wrapper.jar
          chmod +x AnimRetargetAndroid/gradlew
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v3
      - name: Install SDK 34
        run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0'
      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4
      - name: Build original app
        working-directory: AnimRetargetAndroid
        run: ./gradlew --no-daemon --stacktrace assembleDebug
      - name: Publish APK
        uses: actions/upload-artifact@v4
        with:
          name: AnimRetargetAndroid-debug-APK
          path: AnimRetargetAndroid/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
