name: Publish Phoenix Forge ONE VERIFIED GLB TEST APK
on:
  push:
    branches: [fix/forge-one-verified-glb-handoff-20261031]
    paths: ['integration/autolod-publish-trigger.txt']
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch verified Android APK artifact from isolated full build
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: '41236498365'
        shell: bash
        run: |
          set -euo pipefail
          [[ "${SOURCE_RUN}" =~ ^[0-9]+$ ]]
          API="https://api.github.com/repos/$GITHUB_REPOSITORY"
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$API/actions/runs/$SOURCE_RUN" -o /tmp/run.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/run.json'))
          assert d.get('conclusion')=='success', 'Full Android build is not successful'
          assert d.get('head_branch')=='fix/forge-one-verified-glb-handoff-20261031', 'Wrong branch'
          print('Verified source run',d['id'])
          PY
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$API/actions/runs/$SOURCE_RUN/artifacts" -o /tmp/artifacts.json
          ASSET_ID="$(python3 - <<'PY'
          import json
          a=[x for x in json.load(open('/tmp/artifacts.json'))['artifacts'] if x['name']=='PhoenixCharacterForge-ONE-APK' and not x.get('expired')]
          assert len(a)==1,'Missing or duplicate APK artifact'
          print(a[0]['id'])
          PY
          )"
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "$API/actions/artifacts/$ASSET_ID/zip" -o /tmp/apk-artifact.zip
          mkdir -p /tmp/autolod
          unzip -q /tmp/apk-artifact.zip -d /tmp/autolod
          SRC="$(find /tmp/autolod -type f -name '*.apk' | head -n 1)"
          test -n "$SRC"
          cp "$SRC" Phoenix-Forge-ONE-VERIFIED-GLB-TEST.apk
          test -s Phoenix-Forge-ONE-VERIFIED-GLB-TEST.apk
          sha256sum Phoenix-Forge-ONE-VERIFIED-GLB-TEST.apk
      - name: Publish direct test APK link
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create phoenix-one-verified-glb-test-20261031 Phoenix-Forge-ONE-VERIFIED-GLB-TEST.apk \
            --target "$GITHUB_SHA" --title "Phoenix Forge ONE — VERIFIED GLB HANDOFF TEST" \
            --prerelease \
            --notes "Экспериментальная отдельная Android-сборка (не заменяет установленный Forge ONE). Прицельное исправление потери персонажа при переходе Rig → Character: проверка настоящего GLB, скелета и весов; исходный Rig держится до успешной загрузки Character; при ошибке можно вернуться без потери сцены. Алгоритм AutoLOD не менялся. CI пройден, но проверка на реальной GLB-модели коровки ещё требуется."
